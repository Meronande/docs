name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, zlib, gd, mysqli
          coverage: none

      - name: Lint all tracked PHP files
        run: git ls-files '*.php' | xargs -n 1 php -l

      - name: Run self-test suite
        run: php tools/selftest.php
